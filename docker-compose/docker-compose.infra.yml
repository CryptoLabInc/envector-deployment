# docker-compose.infra.yml
services:
  metadatadb:
    image: postgres:14.9
    cpuset: "${ENVECTOR_INFRA_CPUSET:-}"
    restart: on-failure:10
    command: ["postgres", "-c", "max_wal_size=8GB", "-c", "checkpoint_timeout=10min", "-c", "max_connections=1000"]
    # volumes:
    #   - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/pgdata:/var/lib/postgresql/data
    # ports:
    #   - ${ENVECTOR_DB_PORT:-5432}:5432
    environment:
      - POSTGRES_USER=${ENVECTOR_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${ENVECTOR_DB_PASSWORD:-.}
      - POSTGRES_DB=${ENVECTOR_DB_NAME:-mydatabase}
      - POSTGRES_SCHEMA=${ENVECTOR_DB_SCHEMA:-public}

  storage:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    cpuset: "${ENVECTOR_INFRA_CPUSET:-}"
    restart: on-failure:10
    environment:
      MINIO_ROOT_USER: ${ENVECTOR_STORAGE_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${ENVECTOR_STORAGE_PASSWORD:-.}
      # Cap Go runtime parallelism; MinIO's Go build is not cgroup-aware.
      GOMAXPROCS: "${ENVECTOR_STORAGE_GOMAXPROCS:-16}"
    command: server /data --address ":${ENVECTOR_STORAGE_PORT:-59000}" --console-address ":${ENVECTOR_STORAGE_CONSOLE_PORT:-59001}"
    # volumes:
    #   - ${DOCKER_VOLUME_DIRECTORY:-./volumes}/minio/data:/data
    # ports:
    #   - ${ENVECTOR_STORAGE_PORT:-59000}:${ENVECTOR_STORAGE_PORT:-59000}
    #   - ${ENVECTOR_STORAGE_CONSOLE_PORT:-59001}:${ENVECTOR_STORAGE_CONSOLE_PORT:-59001}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ENVECTOR_STORAGE_PORT:-59000}/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '16.0'

  envector-backend:
    depends_on:
      storage:
        condition: service_healthy
      metadatadb:
        condition: service_started

  envector-orchestrator:
    depends_on:
      storage:
        condition: service_healthy
      metadatadb:
        condition: service_started

  envector-shaper:
    depends_on:
      storage:
        condition: service_healthy

  # ── Optional: pgAdmin DB UI ──
  # Uncomment to browse metadatadb at http://localhost:5050
  # Login: admin@admin.com / admin
  # Add server → Host: metadatadb, Port: 5432, DB: mydatabase, User: postgres
  # pgadmin:
  #   image: dpage/pgadmin4
  #   restart: on-failure:3
  #   ports:
  #     - "5050:80"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   depends_on:
  #     - metadatadb

networks:
  default:
